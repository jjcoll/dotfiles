"$schema" = 'https://starship.rs/config-schema.json'

# Explicit format: only these modules render. Starship's default preset also
# shows node/python/cloud/package versions — left out on purpose, they change
# the prompt width constantly and you can ask for them when you care.
format = "$directory$git_branch$git_status$cmd_duration$status$character"
right_format = "$time"
add_newline = true

[directory]
truncation_length = 2
truncate_to_repo = false
style = "cyan"
format = "[$path]($style) "

[git_branch]
format = "[$branch]($style) "
style = "yellow"

# ! modified, + staged, ? untracked, $ stashed, ⇡n ahead, ⇣n behind.
# This is the expensive module: it stats the work tree on every prompt.
# Measured medians: ~40ms in a small repo, ~127ms in a 2.5k-file repo, versus
# ~27ms with this block disabled. Set `disabled = true` if a big repo drags.
[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "red"

# Only shows up when a command took real time.
[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "bright-black"

[status]
disabled = false
format = "[$status]($style) "
style = "red"

[character]
success_symbol = "[%](green)"
error_symbol = "[%](red)"

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M:%S"
