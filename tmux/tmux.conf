# --- Splits ---
unbind %
unbind '"'
bind "'" split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move the current pane to a new position using Leader + Shift + HJKL
# -v / -h  forces the pane to join as vertical (stacked) or horizontal (side-by-side)
# -b (before) tells tmux to place moved pane to the left or above the target pane
# .{directory-of} targets the pane physically located in that direction within the current window
bind H move-pane -b -v -t '.{left-of}'
bind L move-pane -h -t '.{right-of}'
bind K move-pane -b -v -t '.{up-of}'
bind J move-pane -v -t '.{down-of}'
# Move pane to the far LEFT of the window
bind Y move-pane -b -h -t '.{left}' 
# Move pane to the far RIGHT of the window
bind O move-pane -h -t '.{right}'
# --- Resize ---
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# --- Copy mode (vi keys) ---
set -g mode-keys vi
set -g status-keys vi

# Enter copy mode with Leader + Escape (default Leader + [ still works)
bind Escape copy-mode

# Visual-style selection and yank to macOS clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Mouse drag selects and copies straight to clipboard (mouse already on)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Cursor & Term ---
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g mouse on

# --- Windows ---
set -g renumber-windows on    # Renumber when a window is closed

# --- Reload ---
# Note: Ensure the path matches exactly where your file is
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Pane borders (Nordfox) ---
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=#5e81ac],#[fg=#7e8188]}#{pane_current_command} '
set -g pane-border-style fg=#444c5e
set -g pane-active-border-style fg=#5e81ac

# --- Status bar (Nordfox) ---
set -g status-right ""   # removes the clock/time
set -g status-style 'bg=#232831,fg=#cdcecf'
set -g status-left '#[fg=#232831,bg=#5e81ac,bold] #S #[default] '
set -g window-status-format '#[fg=#7e8188] #I #W '
set -g window-status-current-format '#[fg=#232831,bg=#5e81ac,bold] #I #W '
set -g message-style 'bg=#39404f,fg=#cdcecf'

# --- Allow passthrough for Kitty graphics ---
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# --- After tpm: tmux-sensible sets base-index 1, we want 0 ---
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
