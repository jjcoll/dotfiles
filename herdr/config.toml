onboarding = false
[theme]
# Base nord, overridden to nightfox's nordfox palette below.
name = "nord"

[theme.custom]
accent = "#5e81ac"        # nord10 — Nord's own selection blue, reads as a fill

# Layering: chrome (bg0) sits BELOW panes (bg1), the active sidebar row lifts
# ABOVE both (bg2). Panes match ghostty's `background` exactly, so the pane area
# is seamless while the sidebar stays a visibly separate layer.
sidebar_bg = "#232831"    # bg0 — chrome, darkest
panel_bg = "#2e3440"      # bg1 — panes, == ghostty `background`
active_row_bg = "#39404f" # bg2 — was bg1, i.e. identical to the pane background,
                          #       so the active row read as no highlight at all
selection_bg = "#3e4a5b"  # sel0 — was bg2, now distinct from active_row_bg
surface0 = "#39404f"      # bg2
surface1 = "#444c5e"      # bg3
surface_dim = "#232831"   # bg0

# Text ramp, every rung lifted one step. herdr dims secondary tokens again on
# top of these, which is what sank fg2/fg3 into bg0. Ratios are against bg0.
text = "#e5e9f0"        # white.base (was fg1)  — 12.2:1
subtext0 = "#cdcecf"    # fg1 (was fg2)         —  9.4:1
overlay1 = "#cdcecf"    # fg1 (was fg2) — inactive tab labels
overlay0 = "#abb1bb"    # fg2 (was off-palette #8d95a3, 4.9:1) — 6.9:1

red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
teal = "#88c0d0"
mauve = "#b48ead"       # magenta.base — these two were unset, so they fell
peach = "#c9826b"       # orange.base    through to herdr's built-in nord

[ui]
status_indicators = "dots"

show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

prompt_new_workspace_name = true

mouse_capture = false
[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

# --- Keymap: tmux parity (~/.config/tmux/tmux.conf) ---
[keys]
# Spaces ≈ tmux sessions → prefix+s, matching `bind s choose-tree`
workspace_picker = "prefix+s"
settings         = "prefix+comma"   # displaced from prefix+s

# tmux muscle memory
detach        = "prefix+d"          # was prefix+q
reload_config = "prefix+r"          # was prefix+shift+r
resize_mode   = "prefix+shift+r"    # displaced from prefix+r

# Splits: herdr names the divider, tmux names the motion — so they invert.
# tmux `bind "'" split-window -v` (stacked)      → split_horizontal
# tmux `bind '"' split-window -h` (side-by-side) → split_vertical
split_horizontal = "prefix+'"
split_vertical   = "prefix+\""

# tmux `bind -r C-hjkl resize-pane`. No auto-repeat here; prefix+shift+r for that.
resize_pane_left  = "prefix+ctrl+h"
resize_pane_down  = "prefix+ctrl+j"
resize_pane_up    = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

# Direct (prefix-less) pane focus. Prefix mode dims the unfocused panes while
# it's open; navigating without prefix avoids that flash. Prefix binds kept.
focus_pane_left  = ["prefix+h", "alt+h"]
focus_pane_down  = ["prefix+j", "alt+j"]
focus_pane_up    = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Spaces-as-sessions extras
switch_workspace = "prefix+shift+1..9"
focus_agent      = "prefix+alt+1..9"

# Navigate mode: j/k drive workspaces (vim-style), arrows drive panes.
# Swap needed because navigate_pane_up/down default to k/j — same keys.
navigate_workspace_up   = "k"
navigate_workspace_down = "j"
navigate_pane_up   = "up"
navigate_pane_down = "down"

# Copy mode. prefix+v is free since split_vertical moved to prefix+", and it
# mirrors `v` starting a selection once inside. Default prefix+[ still works.
copy_mode = ["prefix+v", "prefix+["]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#e5e9f0", bold = true, dim = false }],
  [{ token = "branch", fg = "#81a1c1", dim = false }, { token = "git_status", fg = "#ebcb8b", dim = false }],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#e5e9f0", bold = true, dim = false }, { token = "tab", fg = "#cdcecf", dim = false }],
  [{ token = "state_text", fg = "#a3be8c", dim = false }, { token = "agent", fg = "#81a1c1", dim = false }],
]
